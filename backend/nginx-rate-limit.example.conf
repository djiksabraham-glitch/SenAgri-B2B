# ==============================================================================
# Exemple de configuration Nginx avec Rate Limiting pour SenAgri-B2B
# ==============================================================================
# Cette configuration protège votre serveur web en amont de PHP-FPM / Laravel
# contre les attaques par déni de service (DDoS) et force brute.
#
# À intégrer dans votre bloc `http { ... }` ou dans votre fichier de configuration de site.
# ==============================================================================

# 1. Définition des zones de mémoire partagée pour le Rate Limiting (au niveau http { ... })
#    - $binary_remote_addr : stocke l'adresse IP de manière optimisée (4 octets en IPv4)
#    - zone=nom:taille : alloue 10 Mo (suffisant pour stocker ~160 000 adresses IP)

# Zone globale pour l'ensemble des requêtes API (ex: 30 requêtes par seconde)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

# Zone stricte pour l'authentification (login / register / forgot-password : 5 req/min)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Zone pour les paiements (10 requêtes par minute)
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/m;

# Zone pour la messagerie (30 requêtes par minute)
limit_req_zone $binary_remote_addr zone=messages_limit:10m rate=30r/m;

# Retourner le code HTTP standard 429 au lieu du code 503 par défaut de Nginx
limit_req_status 429;


# 2. Configuration du serveur virtuel
server {
    listen 80;
    server_name api.senagri.sn;

    root /var/www/senagri-backend/public;
    index index.php;

    charset utf-8;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Protection des routes d'authentification (anti brute-force strict)
    location ~* ^/api/auth/(login|register|forgot-password) {
        limit_req zone=auth_limit burst=3 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Protection des endpoints de paiement
    location ~* ^/api/paiements {
        limit_req zone=payment_limit burst=2 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Protection de l'envoi de messages
    location = /api/messages {
        limit_req zone=messages_limit burst=5 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Protection globale de l'API
    location /api/ {
        limit_req zone=api_general_limit burst=20 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Traitement PHP-FPM standard
    location ~ \.php$ {
        fastcgi_pass backend:9000; # ou 127.0.0.1:9000 ou unix:/var/run/php/php8.2-fpm.sock
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
