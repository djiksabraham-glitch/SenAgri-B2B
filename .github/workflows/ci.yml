name: SenAgri CI

on:
  push:
    branches:
      - main
      - Abraham

  pull_request:
    branches:
      - main
      - Abraham

jobs:

  # =========================
  # BACKEND - LARAVEL
  # =========================
  backend:
    name: Backend - Laravel Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, exif, pcntl, zip, intl, pdo_sqlite
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Préparer l'environnement Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Exécuter les tests Laravel
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test


  # =========================
  # FRONTEND - REACT / VITE
  # =========================
  frontend:
    name: Frontend - React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci

      - name: Construire le frontend
        env:
          VITE_API_URL: http://localhost:8000/api
        run: npm run build


  # =========================
  # DOCKER
  # =========================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire les images Docker
        run: docker compose build