services:

  # =========================
  # Base de données MySQL
  # =========================
  db:
    image: mysql:8.4
    container_name: senagri-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: senagri
      MYSQL_USER: senagri
      MYSQL_PASSWORD: senagri_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # Backend Laravel
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: senagri-backend

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      APP_NAME: SenAgri
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      APP_KEY: ${APP_KEY}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: senagri
      DB_USERNAME: senagri
      DB_PASSWORD: senagri_password

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      PAYDUNYA_MODE: ${PAYDUNYA_MODE}
      PAYDUNYA_MASTER_KEY: ${PAYDUNYA_MASTER_KEY}
      PAYDUNYA_PRIVATE_KEY: ${PAYDUNYA_PRIVATE_KEY}
      PAYDUNYA_PUBLIC_KEY: ${PAYDUNYA_PUBLIC_KEY}
      PAYDUNYA_TOKEN: ${PAYDUNYA_TOKEN}

    ports:
      - "8000:8000"

    volumes:
      - ./backend/storage:/var/www/storage


  # =========================
  # Frontend React
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api

    container_name: senagri-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  mysql_data: